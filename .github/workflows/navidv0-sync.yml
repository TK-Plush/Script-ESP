name: navidv0-auto-sync

on:
  schedule:
    # every 6 hours — pulls new movies from jaikonmovie.com and redeploys
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: navidv0-sync
  cancel-in-progress: false

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync catalog (newest pages + hydrate)
        working-directory: Navidv0
        run: node sync.js 3

      - name: Commit data if changed
        working-directory: Navidv0
        run: |
          git config user.name "navidv0-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/db.json
          git diff --cached --quiet || git commit -m "chore: refresh catalog $(date -u +%F)"

      - name: Push
        run: git push origin main
        continue-on-error: true

      - name: Deploy to Vercel
        working-directory: Navidv0
        run: npx --yes vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes